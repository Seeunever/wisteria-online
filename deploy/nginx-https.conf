limit_req_zone $binary_remote_addr zone=wisteria_auth:10m rate=20r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.81.210.196;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://47.81.210.196$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 47.81.210.196;

    ssl_certificate /etc/letsencrypt/live/47.81.210.196/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.81.210.196/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WisteriaTLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/api/auth/(enter|login|register)$ {
        limit_req zone=wisteria_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
